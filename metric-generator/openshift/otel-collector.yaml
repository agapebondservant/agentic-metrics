apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: tracing
  namespace: observability
spec:
  serviceAccount: otel-collector
  networkPolicy:
    enabled: true
  observability:
    metrics: {}
  deploymentUpdateStrategy: {}
  config:
    exporters:
      debug: {}
      otlphttp/clickhouse:
        endpoint: 'http://openlit.openlit.svc.cluster.local:4318'
      otlphttp/tempo:
        auth:
          authenticator: bearertokenauth
        endpoint: 'https://tempo-tracing-gateway.observability.svc.cluster.local:8080/api/traces/v1/application'
        tls:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
          insecure: false
          insecure_skip_verify: true
          reload_interval: 5s
    extensions:
      bearertokenauth:
        filename: /var/run/secrets/kubernetes.io/serviceaccount/token
    processors:
      batch: {}
      k8sattributes: {}
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 25
    receivers:
      jaeger:
        protocols:
          grpc:
            endpoint: '0.0.0.0:14250'
          thrift_binary:
            endpoint: '0.0.0.0:6832'
          thrift_compact:
            endpoint: '0.0.0.0:6831'
          thrift_http:
            endpoint: '0.0.0.0:14268'
      otlp:
        protocols:
          grpc:
            endpoint: '0.0.0.0:4317'
          http:
            endpoint: '0.0.0.0:4318'
      zipkin:
        endpoint: '0.0.0.0:9411'
    service:
      extensions:
        - bearertokenauth
      pipelines:
        traces:
          exporters:
            - debug
            - otlphttp/tempo
            - otlphttp/clickhouse
          processors:
            - memory_limiter
            - k8sattributes
            - batch
          receivers:
            - otlp
            - jaeger
            - zipkin
      telemetry:
        logs:
          development: true
          encoding: json
          level: INFO
        metrics:
          level: detailed
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
  mode: deployment
  resources: {}
  podDnsConfig: {}
  managementState: managed
  upgradeStrategy: automatic
  ingress:
    route: {}
  daemonSetUpdateStrategy: {}
  targetAllocator:
    allocationStrategy: consistent-hashing
    collectorNotReadyGracePeriod: 30s
    collectorTargetReloadInterval: 30s
    filterStrategy: relabel-config
    observability:
      metrics: {}
    prometheusCR:
      scrapeInterval: 30s
    resources: {}
  replicas: 1
  ipFamilyPolicy: SingleStack
  configVersions: 3

